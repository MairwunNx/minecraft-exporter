name: Release

# Run by hand: Actions → Release → Run workflow, with the new version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, like 1.0.0"
        required: true
      changelog:
        description: "Changelog in Markdown; leave empty to take the version's section from CHANGELOG.md"
        required: false
      moonlands:
        description: "Ship the release to Moonlands (needs the FAMILY_ACTIONS_TOKEN secret)"
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release

env:
  IMAGE: ghcr.io/mairwunnx/minecraft-exporter

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      CHANGELOG: ${{ inputs.changelog }}
      NOTES: release-notes.md
    steps:
      - uses: actions/checkout@v7
      - name: Check the version
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$VERSION isn't a version like 1.0.0"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION is already released"; exit 1
          fi
      - name: Write the release notes
        shell: python
        run: |
          import os, re, sys
          version, typed = os.environ["VERSION"], os.environ["CHANGELOG"].strip()
          if typed:
              notes = typed
          else:
              text = open("CHANGELOG.md", encoding="utf-8").read()
              match = re.search(rf"^## {re.escape(version)}\s*$(.*?)(?=^## |\Z)", text, re.M | re.S)
              notes = match.group(1).strip() if match else ""
          if not notes:
              sys.exit(f"::error::No changelog: add a “## {version}” section to CHANGELOG.md or fill the changelog field")
          image = os.environ["IMAGE"]
          notes += f"\n\n**Docker:** `docker pull {image}:{version}`\n"
          open(os.environ["NOTES"], "w", encoding="utf-8").write(notes)
          print(notes)
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build the binaries
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*} arch=${target#*/} name="minecraft-exporter-$VERSION-$os-$arch" exe=minecraft-exporter
            [[ $os == windows ]] && exe=minecraft-exporter.exe
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "build/$name/$exe" .
            cp LICENSE README.md "build/$name/"
            if [[ $os == windows ]]; then (cd build && zip -qr "../dist/$name.zip" "$name"); else tar -czf "dist/$name.tar.gz" -C build "$name"; fi
          done
          (cd dist && sha256sum * > checksums.txt)
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tag the image
        id: tags
        run: |
          IFS=. read -r major minor _ <<< "$VERSION"
          echo "list=$IMAGE:$VERSION,$IMAGE:$major.$minor,$IMAGE:$major,$IMAGE:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ inputs.version }}
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.title=minecraft-exporter
            org.opencontainers.image.description=Prometheus metrics of a Minecraft server through WorldAPI
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.licenses=MIT
      - name: Publish the GitHub release
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "minecraft-exporter $VERSION" --notes-file "$NOTES" dist/*
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    needs: release
    if: inputs.moonlands
    runs-on: ubuntu-latest
    steps:
      - name: Ship to Moonlands
        # Moonlands' “Ship a release” workflow moves its exporter to the new image.
        run: gh workflow run ship-plugin.yml -R MairwunNx/minecraft -f repo="$GITHUB_REPOSITORY" -f version="$VERSION"
        env:
          GH_TOKEN: ${{ secrets.FAMILY_ACTIONS_TOKEN }}
          VERSION: ${{ inputs.version }}
