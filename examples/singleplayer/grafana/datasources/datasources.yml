apiVersion: 1

# Prometheus only: the chat and event tables read WorldAPI straight from Grafana, which a
# singleplayer world doesn't let in, and the dashboard hides them for one anyway.
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
